<style>
/* ── WORK PANEL ── */
#work-panel {
  position:fixed; inset:0; z-index:600;
  display:none; flex-direction:row;
  pointer-events:none;
  overflow:hidden;
}
#work-panel.open { pointer-events:all; display:flex; }

/* work panel column lines */
#work-col-lines-svg {
  position:absolute; inset:0;
  width:100%; height:100%;
  pointer-events:none; z-index:3;
  overflow:visible;
}

#work-strips {
  position:absolute; inset:0;
  pointer-events:none; z-index:2;
}
.wstrip {
  position:absolute; top:0; bottom:0;
  height:100%;
  background:#0a0a0a;
  transform:translateY(-110vh);
  will-change:transform;
}

#work-content {
  position:relative; z-index:4;
  display:flex; flex-direction:row;
  width:100%; height:100%;
  opacity:0; pointer-events:none;
  padding:0 !important;
  box-sizing:border-box;
}
#work-content.visible { opacity:1; pointer-events:none; }
#work-content.visible #work-grid-wrap,
#work-content.visible #work-page-indicator,
#work-content.visible .work-panel-close { pointer-events:all; }

/* ── WORK GRID ── */
#work-grid-wrap {
  flex:1; min-height:0; overflow:hidden;
  position:relative; padding-top:0;
}
#work-grid {
  display:flex; width:200%; height:100%;
  will-change:transform;
}
.wg-page {
  width:50%; height:100%; flex-shrink:0;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  grid-auto-rows:auto;
  align-content:center;
  padding:0 0 48px; gap:0;
  box-sizing:border-box;
}
.wg-card {
  position:relative; overflow:visible;
  cursor:none; pointer-events:all;
  display:flex; flex-direction:column;
}
.wg-img-wrap {
  width:100%; aspect-ratio:16/9;
  overflow:hidden; flex-shrink:0;
  clip-path:inset(0 100% 0 0);
  will-change:clip-path;
}
.wg-img {
  width:100%; height:100%; object-fit:cover;
  transform:scale(1.08);
  transition:transform 0.7s cubic-bezier(.16,1,.3,1);
  display:block;
}
.wg-card:hover .wg-img { transform:scale(1.0); }
.wg-info {
  padding:12px 14px 0;
  display:flex; align-items:baseline;
  justify-content:space-between; gap:10px;
  opacity:0; transform:translateY(6px);
  will-change:opacity,transform;
}
.wg-title {
  font-family:'IBM Plex Mono',monospace;
  font-size:14px; font-weight:600;
  color:#fff; letter-spacing:-.01em;
  flex:1; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis;
  line-height:1.2;
}
.wg-year {
  font-family:'IBM Plex Mono',monospace;
  font-size:9px; color:rgba(255,255,255,.4);
  letter-spacing:.1em; flex-shrink:0;
}
.wg-cta {
  font-family:'IBM Plex Mono',monospace;
  font-size:9px; font-weight:600;
  color:rgba(255,255,255,.55); letter-spacing:.18em;
  text-transform:uppercase; text-decoration:none;
  border-bottom:1px solid rgba(255,255,255,.25);
  padding-bottom:1px; flex-shrink:0; cursor:none;
  transition:color .2s, border-color .2s;
}
.wg-cta:hover { color:#fff; border-color:rgba(255,255,255,.8); }

#work-page-indicator {
  position:absolute; bottom:28px; right:40px; left:auto;
  display:flex; align-items:center; gap:5px; z-index:20;
  pointer-events:all;
}
.wg-dot-item {
  display:flex; align-items:center; gap:7px;
  cursor:none;
}
.wg-dot {
  width:5px; height:5px; border-radius:50%;
  background:rgba(255,255,255,.25);
  transition:background .3s, transform .3s;
  flex-shrink:0;
}
.wg-dot.active { background:#fff; transform:scale(1.3); }
.wg-dot-label {
  font-family:'IBM Plex Mono',monospace;
  font-size:10px; font-weight:500; letter-spacing:.12em;
  color:rgba(255,255,255,.35);
  transition:color .3s;
  line-height:1;
}
.wg-dot-item.active .wg-dot-label { color:#fff; }

/* nav arrows */
#work-nav-arrows {
  position:absolute; bottom:20px; left:40px; right:auto;
  display:flex; gap:10px; z-index:20;
  pointer-events:all;
}
.wg-arrow {
  width:40px; height:40px; border-radius:50%;
  border:1px solid rgba(255,255,255,.3);
  background:transparent;
  display:flex; align-items:center; justify-content:center;
  cursor:none;
  transition:background .25s, border-color .25s;
}
.wg-arrow:hover { background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.8); }
.wg-arrow svg { display:block; }

/* ── WORK PANEL CHECKERBOARD BACKGROUND ── */
#work-bg-grid {
  position:absolute; inset:0;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  grid-template-rows:80px 1fr 1fr;
  z-index:0; pointer-events:none;
  background:#0a0a0a;
  opacity:0;
}
.wbg-cell { }

/* ── WORK TYPOGRAPHIC ELEMENT ── */
#work-typo-wrap {
  position:absolute; bottom:96px; left:40px;
  pointer-events:none; z-index:2;
  opacity:0;
  transition:opacity .4s ease .15s;
}
#work-content.visible #work-typo-wrap { opacity:1; }
#work-typo-wrap svg { width:240px; height:auto; display:block; }

/* ── PAGE INDICATOR TEXT FORMAT ── */
#wg-cur-page {
  font-family:'IBM Plex Mono',monospace;
  font-size:12px; font-weight:700; letter-spacing:.1em;
  color:#fff; line-height:1;
}
.wg-pi-sep, #wg-tot-page {
  font-family:'IBM Plex Mono',monospace;
  font-size:12px; font-weight:400; letter-spacing:.1em;
  color:rgba(255,255,255,.35); line-height:1;
}

/* ── Panel close button ── */
.work-panel-close {
  position:absolute; top:28px; right:40px; z-index:20;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px; font-weight:700; letter-spacing:.22em;
  text-transform:uppercase; background:none; border:none;
  border-bottom:1px solid; padding-bottom:2px;
  cursor:none; outline:none;
  pointer-events:all;
  opacity:0;
  transition:opacity .3s ease, color .2s, border-color .2s;
}
#work-content.visible .work-panel-close { opacity:1; }
#work-panel .work-panel-close       { color:rgba(255,255,255,.55); border-color:rgba(255,255,255,.3); }
#work-panel .work-panel-close:hover { color:#fff; border-color:#fff; }
</style>

<script>
(function() {
  // Shuffle helper
  function shuffled(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  const workPanel    = document.getElementById('work-panel');
  const workStripsEl = document.getElementById('work-strips');
  const workContent  = document.getElementById('work-content');

  // ── WORK GRID SYSTEM ──
  const workGridEl  = document.getElementById('work-grid');
  const wgPage1     = document.getElementById('wg-page-1');
  const wgPage2     = document.getElementById('wg-page-2');
  let   wgCurPage   = 0;
  let   wgScrollLock = false;

  // Grid placements
  const WG_PLACES = [
    { col:'1/3', row:'1/3', page:0 },
    { col:'5/6', row:'1/2', page:0 },
    { col:'4/5', row:'2/3', page:0 },
    { col:'3/4', row:'3/4', page:0 },
    { col:'5/6', row:'3/4', page:0 },
    { col:'2/4', row:'1/3', page:1 },
    { col:'1/2', row:'2/3', page:1 },
    { col:'4/5', row:'3/4', page:1 },
  ];

  // Navigate to project page with strip wipe-out transition
  window.navigateToProject = function(i) {
    window.closeWork();
    setTimeout(function() {
      window.location.href = 'project-' + (i + 1) + '.html';
    }, 800);
  };

  // Build grid cards from PROJECTS (global)
  PROJECTS.forEach((p, i) => {
    const pl   = WG_PLACES[i];
    const year = p.meta.split('·').pop().trim();
    const card = document.createElement('div');
    card.className = 'wg-card';
    card.style.gridColumn = pl.col;
    card.style.gridRow    = pl.row;
    card.innerHTML = `
      <div class="wg-img-wrap">
        <img class="wg-img" src="${p.img}" alt="${p.title}" loading="lazy">
      </div>
      <div class="wg-info">
        <span class="wg-title">${p.title}</span>
        <span class="wg-year">${year}</span>
        <a class="wg-cta" href="#">VIEW ↗</a>
      </div>
    `;
    card.addEventListener('click', e => {
      e.preventDefault();
      const rect = card.querySelector('.wg-img-wrap').getBoundingClientRect();
      if (typeof window.openProject === 'function') {
        window.openProject(i, rect);
      }
    });
    card.addEventListener('mouseenter', () => document.body.classList.add('chov'));
    card.addEventListener('mouseleave', () => document.body.classList.remove('chov'));
    (pl.page === 0 ? wgPage1 : wgPage2).appendChild(card);
  });

  // Animate cards in — left to right, as if emerging from behind the vertical grid lines
  function animateWgPage(pageEl, baseDelay) {
    baseDelay = baseDelay || 0;
    // Sort cards by their grid-column start so stagger fires left → right
    const cards = [...pageEl.querySelectorAll('.wg-card')].sort((a, b) => {
      const colA = parseInt(a.style.gridColumn) || 1;
      const colB = parseInt(b.style.gridColumn) || 1;
      return colA - colB;
    });
    cards.forEach((card, i) => {
      const imgWrap = card.querySelector('.wg-img-wrap');
      const info    = card.querySelector('.wg-info');
      const delay   = baseDelay + i * 0.13;
      gsap.fromTo(imgWrap,
        { clipPath: 'inset(0% 100% 0% 0%)' },
        { clipPath: 'inset(0% 0% 0% 0%)', duration: 0.85, ease: 'expo.out', delay }
      );
      gsap.to(info, { opacity:1, y:0, duration:0.55, ease:'expo.out', delay: delay + 0.38 });
    });
  }

  // Reset a page's cards to initial hidden state
  function resetWgPage(pageEl) {
    pageEl.querySelectorAll('.wg-img-wrap').forEach(el => gsap.set(el, { clipPath:'inset(0% 100% 0% 0%)' }));
    pageEl.querySelectorAll('.wg-info').forEach(el => gsap.set(el, { opacity:0, y:6 }));
  }

  // Navigate between pages
  function gotoWgPage(page) {
    if (page < 0 || page > 1 || wgScrollLock) return;
    wgScrollLock = true;
    wgCurPage = page;
    gsap.to(workGridEl, {
      x: page === 0 ? '0%' : '-50%',
      duration:1.0, ease:'expo.inOut',
      onComplete: () => { wgScrollLock = false; }
    });
    const curPageEl = document.getElementById('wg-cur-page');
    if (curPageEl) curPageEl.textContent = (page + 1).toString().padStart(2, '0');
    if (page === 1) {
      resetWgPage(wgPage2);
      animateWgPage(wgPage2, 0.20);
    } else {
      resetWgPage(wgPage1);
      animateWgPage(wgPage1, 0.20);
    }
  }

  // Build strips for work panel — 5 strips matching the 5 grid columns (0/20/40/60/80%)
  const COL_FRACS = [0, 0.20, 0.40, 0.60, 0.80];
  let wStrips = [];
  function buildWorkStrips() {
    workStripsEl.innerHTML = '';
    wStrips = [];
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    COL_FRACS.forEach((frac, i) => {
      const left  = Math.round(frac * vw);
      const right = i < COL_FRACS.length - 1 ? Math.round(COL_FRACS[i + 1] * vw) : vw;
      const s = document.createElement('div');
      s.className = 'wstrip';
      s.style.left  = left + 'px';
      s.style.width = (right - left) + 'px';
      gsap.set(s, { y: -vh });
      workStripsEl.appendChild(s);
      wStrips.push(s);
    });
  }
  buildWorkStrips();

  const workBgGrid = document.getElementById('work-bg-grid');

  window.openWork = function openWork() {
    const vh = window.innerHeight;
    workPanel.classList.add('open');
    document.body.classList.add('about-open');
    document.body.classList.add('work-panel-open');
    workContent.classList.remove('visible');

    gsap.set(workBgGrid, { opacity: 0 });
    wStrips.forEach(s => gsap.set(s, { y: -vh, opacity: 1 }));

    const ordered = shuffled([...wStrips]);
    const total   = ordered.length;
    const dur     = 0.55;

    ordered.forEach((s, i) => {
      const delay = (i / total) * dur * 0.6;
      gsap.fromTo(s,
        { y: -vh },
        { y: 0, duration: 0.42, ease: 'expo.out', delay }
      );
    });

    gsap.delayedCall(dur * 0.55 + 0.12, () => {
      gsap.to(workBgGrid, { opacity: 1, duration: 0.25 });
      workContent.classList.add('visible');
      animateWgPage(wgPage1, 0.08);
    });

    gsap.to(wStrips, { opacity: 0, duration: 0.5, delay: dur * 0.55 + 0.18 });
  };

  window.closeWork = function closeWork() {
    const vh = window.innerHeight;
    document.body.classList.remove('cursor-close-work');

    gsap.killTweensOf(wStrips);
    wStrips.forEach(s => gsap.set(s, { y: 0, opacity: 1 }));
    gsap.to(workBgGrid, { opacity: 0, duration: 0.20 });

    gsap.to(workContent, { opacity: 0, duration: 0.30, ease: 'power2.out' });

    const ordered = shuffled([...wStrips]);
    const total   = ordered.length;
    const dur     = 0.60;

    ordered.forEach((s, i) => {
      const delay = (i / total) * dur * 0.45;
      gsap.fromTo(s,
        { y: 0 },
        { y: -vh, duration: 0.48, ease: 'power3.out', delay }
      );
    });

    gsap.delayedCall(dur * 0.45 + 0.30, () => {
      workContent.classList.remove('visible');
      workPanel.classList.remove('open');
      document.body.classList.remove('about-open');
      document.body.classList.remove('work-panel-open');
      wStrips.forEach(s => gsap.set(s, { y: -vh, opacity: 1 }));
      gsap.set(workBgGrid, { opacity: 0 });
      gsap.set(workContent, { clearProps: 'opacity' });
      wgCurPage = 0;
      gsap.set(workGridEl, { x: '0%' });
      const curPageEl = document.getElementById('wg-cur-page');
      if (curPageEl) curPageEl.textContent = '01';
      resetWgPage(wgPage1);
      resetWgPage(wgPage2);
    });
  };

  // Arrow nav
  document.getElementById('wg-prev').addEventListener('click', () => gotoWgPage(0));
  document.getElementById('wg-next').addEventListener('click', () => gotoWgPage(1));
  ['wg-prev','wg-next'].forEach(id => {
    const btn = document.getElementById(id);
    btn.addEventListener('mouseenter', () => document.body.classList.add('chov'));
    btn.addEventListener('mouseleave', () => document.body.classList.remove('chov'));
  });

  // Wheel to page through grid
  document.getElementById('work-grid-wrap').addEventListener('wheel', e => {
    if (e.deltaY > 20 && wgCurPage === 0) gotoWgPage(1);
    if (e.deltaY < -20 && wgCurPage === 1) gotoWgPage(0);
  }, { passive:true });

  const workCloseBtn = document.getElementById('work-close-btn');
  workCloseBtn.addEventListener('click', () => window.closeWork());
  workCloseBtn.addEventListener('mouseenter', () => document.body.classList.add('chov'));
  workCloseBtn.addEventListener('mouseleave', () => document.body.classList.remove('chov'));

  workStripsEl.addEventListener('click', () => window.closeWork());
  workStripsEl.addEventListener('mouseenter', () => document.body.classList.add('cursor-close-work'));
  workStripsEl.addEventListener('mouseleave', () => document.body.classList.remove('cursor-close-work'));

  // Escape key for work panel
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && workPanel.classList.contains('open')) {
      window.closeWork();
    }
  });

  // Work panel column line cursor bend
  (function initWorkColLines() {
    const svg = document.getElementById('work-col-lines-svg');
    if (!svg) return;
    const colPaths = [...svg.querySelectorAll('path')];
    const FRACS    = [0.20, 0.40, 0.60, 0.80];
    const SEGS     = 60;
    const H_RADIUS = 280;
    const SIGMA_Y  = 220;
    const MAX_DISP = 14;
    const TWO_SIG2 = 2 * SIGMA_Y * SIGMA_Y;

    let clx = window.innerWidth / 2, cly = window.innerHeight / 2;

    // Listen to mousemove on document to get mx/my
    // mx/my are defined in index.html but we can track locally here
    let _mx = window.innerWidth / 2, _my = window.innerHeight / 2;
    document.addEventListener('mousemove', function(e) { _mx = e.clientX; _my = e.clientY; }, { passive: true });

    function tick() {
      const panel = document.getElementById('work-panel');
      if (!panel || !panel.classList.contains('open')) {
        requestAnimationFrame(tick); return;
      }
      const w = panel.offsetWidth;
      const h = panel.offsetHeight;

      clx += (_mx - clx) * 0.08;
      cly += (_my - cly) * 0.08;

      FRACS.forEach((frac, idx) => {
        const lx      = frac * w;
        const dx      = clx - lx;
        const hfactor = Math.max(0, 1 - Math.abs(dx) / H_RADIUS);
        const disp    = dx * MAX_DISP / H_RADIUS * hfactor * hfactor;

        let d = `M ${lx} 0`;
        for (let i = 1; i <= SEGS; i++) {
          const y    = (i / SEGS) * h;
          const dy   = cly - y;
          const gaus = Math.exp(-(dy * dy) / TWO_SIG2);
          d += ` L ${(lx + disp * gaus).toFixed(2)} ${y}`;
        }
        colPaths[idx].setAttribute('d', d);
      });

      requestAnimationFrame(tick);
    }
    tick();
  })();


  window.workLoaded = true;
})();
</script>
