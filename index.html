<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arun Somasekharan — UI/UX Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:  #f6f4f2;
  --ink: #0e0e0e;
  --dim: #999;
}
html, body {
  width:100%; height:100%;
  background:var(--bg);
  color:var(--ink);
  font-family:'IBM Plex Mono', monospace;
  overflow:hidden;
  cursor:none;
  -webkit-font-smoothing:antialiased;
}

/* ── CURSOR ── */
#cdot {
  position:fixed; width:7px; height:7px; top:0; left:0;
  background:var(--ink); border-radius:50%;
  pointer-events:none; z-index:9999;
  will-change:transform;
  transition: background .2s, width .2s, height .2s;
}
#cring {
  position:fixed; width:30px; height:30px; top:0; left:0;
  border:1px solid rgba(14,14,14,.22);
  border-radius:50%; pointer-events:none; z-index:9998;
  will-change:transform;
  transition: width .28s cubic-bezier(.16,1,.3,1),
              height .28s cubic-bezier(.16,1,.3,1),
              border-color .25s, border-width .25s;
}
/* hover state — orange dot + expanded ring */
body.chov #cdot  { background: #ff5c00; width:7px; height:7px; }
body.chov #cring { width:50px; height:50px; border-color:rgba(255,92,0,.5); }
/* about panel open — white ring */
body.about-open #cring { border-color:rgba(255,255,255,.35); }
body.about-open.chov #cring { border-color:rgba(255,255,255,.7); width:50px; height:50px; }
body.about-open #cdot { background:#f6f4f2; }
body.about-open.chov #cdot { background:#ff5c00; }

/* ── STAGE ── */
#stage { position:fixed; inset:0; overflow:hidden; }

/* ── COLUMN GRID LINES — drawn via SVG for cursor interaction ── */
#col-lines-svg {
  position:fixed; inset:0;
  width:100%; height:100%;
  pointer-events:none;
  z-index:0;
  overflow:visible;
}

/* ── NAV ── */
nav {
  position:fixed; top:0; left:0; right:0;
  padding:28px 40px 0;
  display:flex; justify-content:space-between; align-items:flex-start;
  z-index:700; pointer-events:none;
}
.nlogo {
  display:block;
  pointer-events:all; text-decoration:none; cursor:none;
  line-height:1;
  color:var(--ink);  /* SVG uses currentColor */
}
.nlogo svg { display:block; width:91px; height:28px; }
.nwork {
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  font-weight:700;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--ink);
  border-bottom:1px solid var(--ink);
  padding-bottom:3px;
  pointer-events:all; text-decoration:none; cursor:none;
  line-height:1;
  transition: color .2s, border-color .2s;
}
.nwork:hover { color:#ff5c00; border-color:#ff5c00; }

/* ── ABOUT ME TRIGGER (bottom-right) ── */
#about-trigger {
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  font-weight:700;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--ink);
  background:none;
  border:none;
  border-bottom:1px solid var(--ink);
  padding-bottom:3px;
  cursor:none;
  pointer-events:all;
  opacity:0;
  white-space:nowrap;
  line-height:1;
  transition: color .2s, border-color .2s, opacity .2s;
}
#about-trigger:hover { color:#ff5c00 !important; border-color:#ff5c00 !important; opacity:1 !important; }

/* About panel CSS is in about.html fragment */

/* ── Hide all hbot + nav links when overlay is open ── */
body.overlay-open .nwork,
body.overlay-open #about-trigger,
body.overlay-open .hdesc,
body.overlay-open .hbot-right     { visibility:hidden; pointer-events:none; }

/* ── Hide nav links + hbot extras when any panel is open ── */
body.about-open .nwork          { visibility:hidden; pointer-events:none; }
body.about-open #about-trigger  { visibility:hidden !important; pointer-events:none !important; }
body.about-open .hdesc          { visibility:hidden; pointer-events:none; }
body.about-open .hbot-right     { visibility:hidden; pointer-events:none; }

/* ── Panel close buttons ── */
.panel-close {
  position:absolute; top:28px; right:40px; z-index:20;
  font-family:'IBM Plex Mono',monospace;
  font-size:10px; font-weight:700; letter-spacing:.22em;
  text-transform:uppercase; background:none; border:none;
  border-bottom:1px solid; padding-bottom:2px;
  cursor:none; outline:none;
  pointer-events:all;
  opacity:0;
  transition:opacity .3s ease, color .2s, border-color .2s;
}
#about-content.visible .panel-close { opacity:1; }
#work-content.visible  .panel-close { opacity:1; }

#about-panel .panel-close       { color:#666; border-color:#444; }
#about-panel .panel-close:hover { color:#f6f4f2; border-color:#f6f4f2; }
#work-panel  .panel-close       { color:rgba(255,255,255,.55); border-color:rgba(255,255,255,.3); }
#work-panel  .panel-close:hover { color:#fff; border-color:#fff; }

/* ── PANEL: nav tint when About or Work panel is open (dark bg) ── */
body.work-panel-open nav .nlogo         { color:#f6f4f2; }
body.about-panel-open nav .nlogo        { color:#f6f4f2; }
body.about-panel-open nav .nwork        { color:rgba(245,244,240,.7); border-bottom-color:rgba(245,244,240,.4); }
body.about-panel-open nav .nwork:hover  { color:#f6f4f2; border-bottom-color:#f6f4f2; }
body.about-panel-open #about-trigger    { color:rgba(245,244,240,.7) !important; border-bottom-color:rgba(245,244,240,.4) !important; }
body.about-panel-open #about-trigger:hover { color:#f6f4f2 !important; border-bottom-color:#f6f4f2 !important; }

/* ── CURSOR CLOSE STATE ── */
/* Both panels: dot hidden, ring expands with ✕ */
body.cursor-close #cdot,
body.cursor-close-work #cdot { opacity:0; width:0; height:0; }

body.cursor-close #cring {
  width:54px; height:54px;
  border-color:rgba(245,244,240,.6); border-width:1px;
}
body.cursor-close #cring::after {
  content:'✕';
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font-size:15px; font-family:'IBM Plex Mono',monospace; font-weight:300;
  color:#f6f4f2;
}
body.cursor-close-work #cring {
  width:54px; height:54px;
  border-color:rgba(255,255,255,.5); border-width:1px;
}
body.cursor-close-work #cring::after {
  content:'✕';
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font-size:15px; font-family:'IBM Plex Mono',monospace; font-weight:300;
  color:#f6f4f2;
}

/* ── CLOSE LABEL — follows cursor when in close zone ── */
#clabel {
  position:fixed; top:0; left:0; z-index:9997; pointer-events:none; will-change:transform;
  font-family:'IBM Plex Mono',monospace;
  font-size:8px; font-weight:700; letter-spacing:.22em;
  text-transform:uppercase;
  opacity:0;
  transition: opacity .18s ease;
  white-space:nowrap;
}
body.cursor-close      #clabel { opacity:1; color:#f6f4f2; }
body.cursor-close-work #clabel { opacity:1; color:#f6f4f2; }

/* Work panel CSS is in work.html fragment */

/* Right: hover image preview — same 254×159 ratio (1.597:1) */
#work-preview {
  position:fixed;
  top:0; left:0;
  pointer-events:none;
  z-index:8;
  width:clamp(280px, 30vw, 472px);   /* +24% from 380px */
  will-change:transform;
  transform:translate(0,0);
}
#work-preview-img {
  width:100%;
  aspect-ratio:254/159;
  object-fit:cover;
  display:block;
  opacity:0;
  will-change:transform, opacity;
}

#orbit-group {
  position:absolute; inset:0;
  will-change:transform;
  z-index:10;
}

/* ── HERO NAME (solid black layer — always visible on bg) ──
   Figma: Archivo Bold, large display size
   z-index 150 — sits above thumbs visually
   But we want it to show dark on bg AND invert on thumbs.
   Solution: TWO layers
     Layer 1 (z=140): black text, BELOW thumbs (z=10–20)
     Layer 2 (z=160): white text, mix-blend-mode:difference, ABOVE thumbs
     → On light bg: white difference = dark (near bg colour, so layer 1 shows)
     → On dark thumb: white difference = white ✓
   Wait — layer 1 is BELOW thumbs so thumbs cover it.
   On the AREAS not covered by thumbs, layer 1 is visible as black.
   On AREAS covered by thumbs, layer 2 (white+difference) is above
   the thumb and inverts to white. ✓
── */

/* ── HERO NAME — single layer, always above thumbs, always dark ── */
/* ── HERO NAME — SVG headline, centred ── */
.hname {
  position:absolute;
  left:50%; top:50%;
  transform:translate(-50%, -50%);
  z-index:160;
  pointer-events:none;
  width:clamp(480px, 75vw, 1076px);
}
.hname svg {
  width:100%;
  height:auto;
  display:block;
}
.hname-inv { display:none; }
/* keep .lw/.li so entrance animation targets still exist but are invisible */
.lw { overflow:hidden; display:block; height:0; overflow:hidden; }
.li { display:block; transform:translateY(0); opacity:0; height:0; }

/* ── THUMBNAIL HOVER BLUR SIBLINGS ── */
/* When hovering any thumb, others blur + dim */
.thumb .thumb-clip img {
  filter: blur(0px);   /* explicit start so browser interpolates, not jumps */
  opacity: 1;
  transition: filter .55s cubic-bezier(.16,1,.3,1), opacity .55s cubic-bezier(.16,1,.3,1),
              transform .45s cubic-bezier(.16,1,.3,1);
  will-change: transform;
}
body.thumb-hov .thumb:not(.is-hovered) .thumb-clip img {
  filter: blur(3px);
  opacity: 0.35;
}
body.thumb-hov .thumb.is-hovered .thumb-clip img {
  filter: blur(0px);
  opacity: 1;
}

/* ── THUMBNAIL HOVER LINE ── */
.thumb::after {
  content:'';
  position:absolute;
  top:0; right:0;
  width:3px; height:100%;
  background:#FD3B34;
  transform:scaleY(0);
  transform-origin:bottom center;
  transition:transform .35s cubic-bezier(.16,1,.3,1);
  pointer-events:none;
  z-index:5;
}
.thumb.is-hovered::after { transform:scaleY(1); }
.hbot {
  position:fixed; bottom:32px; left:0; right:0;
  padding:0 40px;
  display:flex; justify-content:space-between; align-items:flex-end;
  z-index:700; pointer-events:none;
}
/* Left column: desc + about me */
.hbot-left {
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:14px;
}
/* Right column: shiva + index stacked, right-aligned */
.hbot-right {
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:12px;
}
/* "01-08" → Archivo Bold 16px */
.hidx {
  font-family:'IBM Plex Mono',monospace;
  font-size:clamp(11px,1.1vw,16px);
  font-weight:700;
  letter-spacing:.04em;
  color:var(--ink);
  opacity:0;
}
/* Desc → Archivo Regular 16px, line-height 120% */
.hdesc { text-align:left; opacity:0; }
.hdesc p {
  font-family:'IBM Plex Mono',monospace;
  font-size:clamp(11px,1.1vw,16px);
  font-weight:400;
  line-height:1.2;
  color:var(--ink);
}
.hdesc .sub {
  font-family:'IBM Plex Mono',monospace;
  font-size:clamp(10px,1vw,16px);
  font-weight:400;
  letter-spacing:.01em;
  color:var(--ink);
  margin-top:6px;
}

/* ── SHIVA SPRITE ── */
#shiva {
  display:block;
  width: 154px;
  height: 154px;
  background-image: url('Shiva-run.png');
  background-size: calc(154px * 5) calc(154px * 5);
  background-repeat: no-repeat;
  background-position: 0 0;
  image-rendering: crisp-edges;
  pointer-events: none;
  opacity: 0;
  mix-blend-mode: multiply;
  flex-shrink:0;
  margin-right: -38px; /* pull right to optically align sprite with 01–08 text below */
}
@keyframes shiva-run {
  0%    { background-position:    0px    0px; }
  4%    { background-position: -154px    0px; }
  8%    { background-position: -308px    0px; }
  12%   { background-position: -462px    0px; }
  16%   { background-position: -616px    0px; }
  20%   { background-position:    0px -154px; }
  24%   { background-position: -154px -154px; }
  28%   { background-position: -308px -154px; }
  32%   { background-position: -462px -154px; }
  36%   { background-position: -616px -154px; }
  40%   { background-position:    0px -308px; }
  44%   { background-position: -154px -308px; }
  48%   { background-position: -308px -308px; }
  52%   { background-position: -462px -308px; }
  56%   { background-position: -616px -308px; }
  60%   { background-position:    0px -462px; }
  64%   { background-position: -154px -462px; }
  68%   { background-position: -308px -462px; }
  72%   { background-position: -462px -462px; }
  76%   { background-position: -616px -462px; }
  80%   { background-position:    0px -616px; }
  84%   { background-position: -154px -616px; }
  88%   { background-position: -308px -616px; }
  92%   { background-position: -462px -616px; }
  96%   { background-position: -616px -616px; }
  100%  { background-position:    0px    0px; }
}
.thumb {
  position:absolute;
  overflow:visible; cursor:none;
  will-change:transform;
  backface-visibility:hidden;
  transform-style: preserve-3d;
  transition:box-shadow .4s cubic-bezier(.16,1,.3,1);
}
/* Feature thumb shadow — matches Figma layered drop shadow spec */
.thumb.is-feature {
  overflow:visible;  /* shadows must escape the thumb bounds */
  box-shadow:
    0 16px  34px rgba(0,0,0,.10),
    0 62px  62px rgba(0,0,0,.09),
    0 140px 84px rgba(0,0,0,.05),
    0 248px 99px rgba(0,0,0,.01);
}
/* clip wrapper keeps image bounded while shadow can bleed outside */
.thumb .thumb-clip {
  position:absolute; inset:0;
  overflow:hidden;
}
.thumb img {
  width:100%; height:100%;
  object-fit:cover; display:block;
  pointer-events:none;
  will-change:transform;
}
.tinfo {
  position:absolute; bottom:0; left:0; right:0;
  padding:16px 12px 11px;
  background:linear-gradient(transparent, rgba(0,0,0,.5));
  opacity:0; transition:opacity .3s;
  pointer-events:none;
}
.tinfo span {
  font-family:'IBM Plex Mono',monospace;
  font-size:9px; font-weight:700; letter-spacing:.2em;
  text-transform:uppercase; color:#fff;
}

/* ── OVERLAY ── */
#overlay {
  position:fixed; inset:0; z-index:800;
  background:var(--bg);
  display:none; flex-direction:column;
}
#overlay.open { display:flex; }

/* Thin top bar — logo + close only */
#ovbar {
  flex-shrink:0;
  height:72px;
  padding:0 40px;
  display:flex; justify-content:space-between; align-items:center;
  border-bottom:1px solid rgba(14,14,14,.07);
  background:var(--bg);
}
#ovclose {
  font-family:'IBM Plex Mono',monospace;
  font-size:10px; font-weight:700; letter-spacing:.22em;
  text-transform:uppercase; background:none; border:none;
  border-bottom:1px solid var(--ink); padding-bottom:2px;
  color:var(--ink); cursor:none; outline:none; flex-shrink:0;
  transition: color .2s, border-color .2s;
}
#ovclose:hover { color:#ff5c00; border-color:#ff5c00; }

/* Image fills everything below the bar */
#ovmedia { flex:1; overflow:hidden; position:relative; }
#ovimg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }

/* Dark gradient + caption overlaid on image */
#ovcaption {
  position:absolute; left:0; right:0; bottom:0;
  padding:80px 56px 48px;
  background:linear-gradient(to top, rgba(0,0,0,.72) 0%, rgba(0,0,0,.3) 55%, transparent 100%);
  pointer-events:none;
}
#ovtitle {
  font-family:'Space Grotesk', sans-serif;
  font-size:clamp(24px,3.5vw,52px);
  font-weight:700; letter-spacing:-.02em; line-height:1;
  color:#fff;
}
#ovmeta {
  font-family:'IBM Plex Mono',monospace;
  font-size:clamp(10px,1vw,13px); font-weight:400;
  letter-spacing:.14em; color:rgba(255,255,255,.6); margin-top:10px;
}

/* ── WORK PANEL CHECKERBOARD BACKGROUND ── */
#work-bg-grid {
  position:absolute; inset:0;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  grid-template-rows:80px 1fr 1fr;
  z-index:0; pointer-events:none;
  background:#0a0a0a;
  opacity:0; /* stays transparent until strips have landed */
}
.wbg-cell { }

/* ── WORK TYPOGRAPHIC ELEMENT ── */
#work-typo-wrap {
  position:absolute; bottom:96px; left:40px;
  pointer-events:none; z-index:2;
  opacity:0; /* fades in with work content */
  transition:opacity .4s ease .15s;
}
#work-content.visible #work-typo-wrap { opacity:1; }
#work-typo-wrap svg { width:240px; height:auto; display:block; }

/* ── PAGE INDICATOR TEXT FORMAT ── */
#wg-cur-page {
  font-family:'IBM Plex Mono',monospace;
  font-size:12px; font-weight:700; letter-spacing:.1em;
  color:#fff; line-height:1;
}
.wg-pi-sep, #wg-tot-page {
  font-family:'IBM Plex Mono',monospace;
  font-size:12px; font-weight:400; letter-spacing:.1em;
  color:rgba(255,255,255,.35); line-height:1;
}
</style>
</head>
<body>

<div id="cdot"></div>
<div id="cring"></div>
<div id="clabel">CLOSE</div>

<nav>
    <a href="#" class="nlogo">

    </a>
    <a href="#" class="nwork" id="work-trigger">Work</a>
</nav>

<!-- Column grid lines — interactive SVG, cursor bends each line -->
<svg id="col-lines-svg" aria-hidden="true">
  <path fill="none" stroke="#E0DDDD" stroke-width="1"/>
  <path fill="none" stroke="#E0DDDD" stroke-width="1"/>
  <path fill="none" stroke="#E0DDDD" stroke-width="1"/>
  <path fill="none" stroke="#E0DDDD" stroke-width="1"/>
</svg>

<div id="stage">
  <!-- hero-gl: WebGL pixel-displacement canvas — z:1, behind orbit/nav -->
  <canvas id="hero-gl" style="position:absolute;inset:0;z-index:1;pointer-events:none;width:100%;height:100%;display:block;"></canvas>

  <div id="orbit-group"></div>

const CX = VW * 0.50;   // centre x
const CY = VH * 0.50;   // centre y
const RX = VW * 0.30;   // horizontal radius — tighter than before
const RY = VH * 0.28;   // vertical radius   — flatter oval

const FEATURE_ANGLE = 0; // rightmost = feature zone
const STEP = (Math.PI * 2) / N;

/* ── BUILD DOM ── */
const orbitGroup = document.getElementById('orbit-group');

const thumbs = PROJECTS.map((p, i) => {
  const homeAngle = FEATURE_ANGLE + (i / N) * Math.PI * 2;
  const el = document.createElement('div');
  el.className = 'thumb';
  el.style.cssText = `width:${TW}px; height:${TH}px; opacity:0; position:absolute;`;
  el.innerHTML = `
    <div class="thumb-clip">
      <img src="${p.img}" alt="${p.title}" loading="${i < 3 ? 'eager' : 'lazy'}">
    </div>
    <div class="tinfo"><span>${p.title}</span></div>
  `;
  el.addEventListener('click', () => openProject(i));
  orbitGroup.appendChild(el);
  const imgEl  = el.querySelector('img');
  const infoEl = el.querySelector('.tinfo');
  return { ...p, el, imgEl, infoEl, homeAngle, hx:0, hy:0, thx:0, thy:0,
    tiltX:0, tiltY:0, tTiltX:0, tTiltY:0,
    entranceScale:0.94, entranceY:18   // spring entrance starting state
  };
});

/* ── PLACE ── */
function ellipsePos(angle) {
  return {
    ex: CX + RX * Math.cos(angle),
    ey: CY + RY * Math.sin(angle),
  };
}

// Declared early — used inside placeThumb which runs before the entrance block
let entranceDone = false;

function placeThumb(t, angle, scale, hx, hy, tiltX, tiltY) {
  const { ex, ey } = ellipsePos(angle);
  const es = entranceDone ? 1 : (t.entranceScale || 1);
  const ey2 = entranceDone ? 0 : (t.entranceY || 0);
  const finalScale = scale * es;
  const w = TW * finalScale, h = TH * finalScale;
  const x = ex - w/2 + hx;
  const y = ey - h/2 + hy + ey2;
  const rx = (tiltX || 0).toFixed(3);
  const ry = (tiltY || 0).toFixed(3);
  t.el.style.transform = `perspective(800px) translate(${x}px,${y}px) scale(${finalScale}) rotateX(${rx}deg) rotateY(${ry}deg)`;
  t.el.style.transformOrigin = 'top left';
  // Feature thumb ALWAYS on top — z=30 vs z=10 for all others
  const isFeature = finalScale > 1.5;
  t.el.style.zIndex = isFeature ? '30' : '10';
  // Toggle shadow class
  t.el.classList.toggle('is-feature', isFeature);
}

thumbs.forEach(t => placeThumb(t, t.homeAngle, 1, 0, 0, 0, 0));

/* ── LABEL ── */
const idxLabel = document.getElementById('idxLabel');
let currentFeature = 0;
function updateLabel(idx) {
  if (idx === currentFeature) return;
  currentFeature = idx;
  idxLabel.textContent = `${String(idx+1).padStart(2,'0')}–${String(N).padStart(2,'0')}`;
}

/* ── THUMB SPRING ENTRANCE SYSTEM ──
   Each thumbnail has its own spring state (position + velocity).
   Target goes from off-screen below → final position.
   Remotion spring(mass:1, damping:200, stiffness:100) translated to RAF.
── */
const thumbSprings = thumbs.map((t, i) => ({
  val: 0, vel: 0, active: false, done: false,
  delay: 0.5 + Math.pow(i, 0.55) * 0.13,  // wider power-curve — each thumb has its own moment
}));

const SPRING_STIFF = 0.055;   // softer — slower, more graceful rise
const SPRING_DAMP  = 0.82;    // higher damping — barely any overshoot
const SPRING_THRESH = 0.0008;

let entranceT = 0; // seconds since load
const entranceFPS = 60;

function tickEntranceSprings(dt) {
  if (entranceDone) return;
  entranceT += dt;
  let allDone = true;

  thumbSprings.forEach((sp, i) => {
    if (sp.done) return;
    if (!sp.active && entranceT >= sp.delay) sp.active = true;
    if (!sp.active) { allDone = false; return; }

    // Spring toward 1
    sp.vel += (1 - sp.val) * SPRING_STIFF;
    sp.vel *= SPRING_DAMP;
    sp.val += sp.vel;

    if (Math.abs(1 - sp.val) < SPRING_THRESH && Math.abs(sp.vel) < SPRING_THRESH) {
      sp.val = 1; sp.vel = 0; sp.done = true;
    } else {
      allDone = false;
    }

    // Apply: very subtle scale + gentle lift — premium float not a pop
    const scaleVal = 0.94 + sp.val * 0.06;       // 0.94 → 1.0 — almost imperceptible scale
    const yOffset  = (1 - sp.val) * 18;           // 18px → 0  — delicate upward drift
    const opVal    = Math.min(1, sp.val * 1.15);  // opacity leads slightly, not aggressively

    const t = thumbs[i];
    t.el.style.opacity = opVal.toFixed(3);
    t.entranceScale = scaleVal;
    t.entranceY     = yOffset;
  });

  if (allDone) entranceDone = true;
}

/* ── ENTRANCE ── */
let lastEntranceTime = null;
function entranceRaf(ts) {
  if (!entranceDone) {
    const dt = lastEntranceTime ? (ts - lastEntranceTime) / 1000 : 0;
    lastEntranceTime = ts;
    tickEntranceSprings(dt);
    requestAnimationFrame(entranceRaf);
  }
}

window.addEventListener('load', () => {
  // Init thumb entrance state
  thumbs.forEach(t => { t.entranceScale = 0.94; t.entranceY = 18; });

  // SVG headline — fade + subtle scale up (elastic feel)
  const svgHeadline = document.querySelector('#hname-svg svg');
  if (svgHeadline) {
    gsap.fromTo(svgHeadline,
      { opacity:0, scale:0.96, y:12 },
      { opacity:1, scale:1,    y:0, duration:1.1, ease:'expo.out', delay:0.25 }
    );
  }

  gsap.to('.hidx',  { opacity:1, y:0, duration:0.7, ease:'power3.out', delay:1.05 });
  gsap.to('.hdesc', { opacity:1, y:0, duration:0.7, ease:'power3.out', delay:1.15 });
  gsap.to(document.getElementById('shiva'), { opacity:1, duration:0.5, delay:1.3 });

  // Kick off spring entrance RAF
  requestAnimationFrame(entranceRaf);
});

/* ── SCROLL → ORBIT ── */
let orbitAngle  = 0;
let targetAngle = 0;
let isScrolling = false;
let settleTimer;
let scrollVel   = 0;   // raw scroll speed per frame
let squishScale = 1;   // current squish multiplier (< 1 = squished)

const shivaEl = document.getElementById('shiva');
let shivaRunning = false;
let shivaStopTimer;

function shivaStart() {
  if (shivaRunning) return;
  shivaRunning = true;
  shivaEl.style.animation = 'shiva-run 1.1s steps(1) infinite';
}

function shivaStop() {
  if (!shivaRunning) return;
  // Let Shiva finish the current cycle gracefully then stop
  // 1.1s cycle — stop after one more loop
  clearTimeout(shivaStopTimer);
  shivaStopTimer = setTimeout(() => {
    shivaRunning = false;
    // Snap to first frame
    shivaEl.style.animation = 'none';
    shivaEl.style.backgroundPosition = '0 0';
  }, 1100); // complete one last cycle
}

function nudge(delta) {
  targetAngle += delta;
  isScrolling = true;
  // Track raw velocity for squish effect
  scrollVel = Math.abs(delta);
  shivaStart();
  clearTimeout(settleTimer);
  settleTimer = setTimeout(settle, 170);
}
function settle() {
  isScrolling = false;
  targetAngle = Math.round(targetAngle / STEP) * STEP;
  shivaStop();
}

window.addEventListener('wheel',      e => nudge(e.deltaY * 0.0024), { passive:true });
let lastTY = null;
window.addEventListener('touchstart', e => { lastTY = e.touches[0].clientY; }, {passive:true});
window.addEventListener('touchmove',  e => {
  if (lastTY !== null) { nudge((lastTY - e.touches[0].clientY) * 0.005); lastTY = e.touches[0].clientY; }
}, {passive:true});
window.addEventListener('touchend', () => { lastTY = null; settle(); });

/* ── CURSOR ── */
let mx=VW/2, my=VH/2;
// Spring cursor: position + velocity for organic overshoot
let crx=VW/2, cry=VH/2, cvx=0, cvy=0;
document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; });
const cdot   = document.getElementById('cdot');
const cring  = document.getElementById('cring');
const clabel = document.getElementById('clabel');

function updateCursor() {
  const stiff  = 0.10;
  const damp   = 0.76;
  cvx += (mx - crx) * stiff;
  cvy += (my - cry) * stiff;
  cvx *= damp;
  cvy *= damp;
  crx += cvx;
  cry += cvy;
  // translate3d keeps cursor on compositor thread — no layout triggered
  cdot.style.transform  = `translate3d(calc(${mx}px - 50%), calc(${my}px - 50%), 0)`;
  cring.style.transform = `translate3d(calc(${crx}px - 50%), calc(${cry}px - 50%), 0)`;
  clabel.style.transform = `translate3d(${mx + 22}px, ${my + 22}px, 0)`;
}
thumbs.forEach(t => {
  t.el.addEventListener('mouseenter', () => {
    document.body.classList.add('chov');
    document.body.classList.add('thumb-hov');
    t.el.classList.add('is-hovered');
  });
  t.el.addEventListener('mouseleave', () => {
    document.body.classList.remove('chov');
    document.body.classList.remove('thumb-hov');
    t.el.classList.remove('is-hovered');
  });
});
document.querySelectorAll('.nwork, #ovclose, #about-trigger').forEach(el => {
  el.addEventListener('mouseenter', () => document.body.classList.add('chov'));
  el.addEventListener('mouseleave', () => document.body.classList.remove('chov'));
});

function lerp(a, b, t) { return a + (b-a)*t; }

/* ── GROUP EDGE DRIFT — spring physics ── */
let gTX=0, gTY=0, gCX=0, gCY=0, gVX=0, gVY=0;
const EDGE_Z    = 0.18;
const MAX_DRIFT = Math.round(20 * S);

function edgeDrift() {
  const nx=mx/VW, ny=my/VH;
  let fx=0, fy=0;
  if (nx < EDGE_Z)         fx = -(1-nx/EDGE_Z);
  else if (nx > 1-EDGE_Z)  fx = (nx-(1-EDGE_Z))/EDGE_Z;
  if (ny < EDGE_Z)         fy = -(1-ny/EDGE_Z);
  else if (ny > 1-EDGE_Z)  fy = (ny-(1-EDGE_Z))/EDGE_Z;
  const ss = v => Math.sign(v)*Math.pow(Math.abs(v),2);
  gTX = ss(fx)*MAX_DRIFT;
  gTY = ss(fy)*MAX_DRIFT;
}

function applyGroupDrift() {
  // Spring: stiffness=0.04, damping=0.85 — heavy, slow, organic
  gVX += (gTX - gCX) * 0.04;
  gVY += (gTY - gCY) * 0.04;
  gVX *= 0.85;
  gVY *= 0.85;
  gCX += gVX;
  gCY += gVY;
}

/* ── RENDER LOOP ── */
let overlayOpen = false;
const featureX = CX + RX; // rightmost ellipse point
const featureY = CY;

function loop() {
  requestAnimationFrame(loop);

  // Cursor — spring physics (overshoot + settle)
  updateCursor();

  // Group edge drift — spring physics
  if (!overlayOpen) edgeDrift(); else { gTX=0; gTY=0; }
  applyGroupDrift();
  orbitGroup.style.transform = `translate(${gCX}px,${gCY}px)`;

  // Orbit — faster attack when scrolling, very slow spring settle
  // Remotion spring principle: mass=1, damping=200 → fast settle, slight ease
  const orbitEase = isScrolling ? 0.12 : 0.038;
  orbitAngle = lerp(orbitAngle, targetAngle, orbitEase);

  // ── SQUISH ON FAST SCROLL ──
  // Map scrollVel → target squish. Fast scroll = squish to ~0.88.
  const velClamped   = Math.min(scrollVel * 60, 1);
  const squishTarget = isScrolling ? 1 - velClamped * 0.13 : 1;
  scrollVel = lerp(scrollVel, 0, 0.18);
  // Asymmetric: compress fast (power3), expand slow with spring overshoot
  const squishEase = squishScale > squishTarget
    ? 0.28                          // compressing — fast
    : isScrolling ? 0.055 : 0.038; // expanding — slow spring feel
  squishScale = lerp(squishScale, squishTarget, squishEase);

  // Feature zone threshold
  const maxDist = Math.hypot(RX*2, RY*2);
  const threshold = maxDist * 0.38;

  let closestIdx=0, minDist=Infinity;

  thumbs.forEach((t, i) => {
    const angle = t.homeAngle + orbitAngle;
    const { ex, ey } = ellipsePos(angle);

    const dToFeature = Math.hypot(ex - featureX, ey - featureY);
    if (dToFeature < minDist) { minDist=dToFeature; closestIdx=i; }

    const prox = Math.max(0, 1 - dToFeature / threshold);
    const eased = prox*prox*(3-2*prox);
    const scale = 1 + eased*(FSCALE-1);

    // Repulsion
    const tcx=ex+gCX, tcy=ey+gCY;
    const dx=tcx-mx, dy=tcy-my;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const REPEL = Math.round(155*S);

    if (dist < REPEL && !overlayOpen) {
      const str=(1-dist/REPEL)*18;
      t.thx=(dx/dist)*str; t.thy=(dy/dist)*str;
      t.infoEl.style.opacity='1';
    } else {
      t.thx=0; t.thy=0;
      t.infoEl.style.opacity='0';
    }
    t.hx = lerp(t.hx, t.thx, .09);
    t.hy = lerp(t.hy, t.thy, .09);

    // 3D tilt — base tilt from ellipse position (subtle world angle)
    // Each thumb gets a gentle tilt depending on where it sits on the orbit.
    // Rightmost tilts slightly left-back, leftmost tilts right-back, etc.
    const BASE_TILT = 5; // degrees max base tilt
    const baseTiltY =  Math.cos(angle) * BASE_TILT * -1; // lean inward
    const baseTiltX =  Math.sin(angle) * BASE_TILT * 0.5;

    // Cursor-driven extra tilt — when cursor is near, thumb reacts like a card
    let cursorTiltX = 0, cursorTiltY = 0;
    const TILT_RADIUS = Math.round(200 * S);
    if (dist < TILT_RADIUS && !overlayOpen) {
      const relX = (mx - tcx) / TILT_RADIUS; // -1..1
      const relY = (my - tcy) / TILT_RADIUS;
      const falloff = 1 - dist / TILT_RADIUS;
      cursorTiltX = relY * -6 * falloff;  // tilt toward cursor vertically
      cursorTiltY = relX *  6 * falloff;  // tilt toward cursor horizontally
    }

    t.tTiltX = baseTiltX + cursorTiltX;
    t.tTiltY = baseTiltY + cursorTiltY;
    // Spring tilt: fast attack (0.10), slow release (0.04) — asymmetric like Remotion spring
    const tiltEase = (Math.abs(t.tTiltX - t.tiltX) + Math.abs(t.tTiltY - t.tiltY)) > 1 ? 0.10 : 0.04;
    t.tiltX  = lerp(t.tiltX, t.tTiltX, tiltEase);
    t.tiltY  = lerp(t.tiltY, t.tTiltY, tiltEase);

    // Parallax
    if (dist < REPEL+50) {
      t.imgEl.style.transform = `scale(1.07) translate(${-((mx-tcx)/REPEL)*6}px,${-((my-tcy)/REPEL)*6}px)`;
    } else {
      t.imgEl.style.transform = '';
    }

    placeThumb(t, angle, scale * squishScale, t.hx, t.hy, t.tiltX, t.tiltY);
  });

  updateLabel(closestIdx);
}
loop();

/* ── OPEN / CLOSE ── */
const overlay = document.getElementById('overlay');
const ovimg   = document.getElementById('ovimg');
const ovtitle   = document.getElementById('ovtitle');
const ovmeta    = document.getElementById('ovmeta');
const ovcaption = document.getElementById('ovcaption');
const ovclose = document.getElementById('ovclose');
let savedRect = null;
let overlayFromWork = false;

function openProject(i, sourceRect) {
  const p=PROJECTS[i];
  const rect= sourceRect || thumbs[i].el.getBoundingClientRect();
  savedRect=rect; overlayOpen=true;
  overlayFromWork = !!(document.getElementById('work-panel')?.classList.contains('open'));
  document.body.classList.add('overlay-open');
  ovimg.src=p.img; ovtitle.textContent=p.title; ovmeta.textContent=p.meta;
  ovimg.style.transform='scale(1.08)';
  overlay.style.display='flex';
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  // Clip expand: expo.inOut = fast start, spring-like settle at full screen
  gsap.fromTo(overlay,
    { clipPath:`inset(${(cy/VH*100).toFixed(3)}% ${((VW-cx)/VW*100).toFixed(3)}% ${((VH-cy)/VH*100).toFixed(3)}% ${(cx/VW*100).toFixed(3)}%)` },
    { clipPath:`inset(0% 0% 0% 0%)`, duration:.82, ease:'expo.inOut' }
  );
  // Image: spring scale — back.out gives natural deceleration overshoot
  gsap.to(ovimg, { scale:1, duration:1.3, ease:'back.out(1.2)', delay:.04 });
  // Caption block slides up from bottom of image
  gsap.fromTo(ovcaption, { y:28, opacity:0 }, { y:0, opacity:1, duration:0.75, ease:'expo.out', delay:0.5 });
}

function closeProject() {
  if (!savedRect) return;
  gsap.to(ovcaption, { y:-8, opacity:0, duration:0.22, ease:'power2.in' });
  const r=savedRect, cx=r.left+r.width/2, cy=r.top+r.height/2;
  const targetClip = `inset(${(cy/VH*100).toFixed(3)}% ${((VW-cx)/VW*100).toFixed(3)}% ${((VH-cy)/VH*100).toFixed(3)}% ${(cx/VW*100).toFixed(3)}%)`;
  const fromWork = overlayFromWork;
  gsap.killTweensOf(overlay);
  // fromTo ensures GSAP always knows the exact start state — no cached-state issues
  gsap.fromTo(overlay,
    { clipPath: 'inset(0% 0% 0% 0%)' },
    {
      clipPath: targetClip,
      duration: 0.65, ease: 'expo.in', delay: 0.10,
      onComplete() {
        overlay.style.display='none';
        gsap.set(overlay, { clearProps: 'clipPath' });
        savedRect=null; overlayOpen=false; overlayFromWork=false;
        document.body.classList.remove('overlay-open');
        gsap.set(ovcaption, { y:0, opacity:1 });
        // If opened from work panel, ensure it's still showing
        if (fromWork) {
          const wp = document.getElementById('work-panel');
          if (wp && !wp.classList.contains('open')) {
            window.openWork?.();
          }
        }
      }
    }
  );
}

ovclose.addEventListener('click', closeProject);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeProject();
    window.closeAbout?.();
    window.closeWork?.();
  }
});

/* ══════════════════════════════════════════════
   LAZY FRAGMENT LOADER
══════════════════════════════════════════════ */
async function loadFragment(url, containerId, loadedFlag) {
  if (window[loadedFlag]) return;
  const res  = await fetch(url + '?v=' + Date.now());
  const html = await res.text();
  const container = document.getElementById(containerId);
  container.innerHTML = html;
  container.querySelectorAll('script').forEach(oldScript => {
    const newScript = document.createElement('script');
    newScript.textContent = oldScript.textContent;
    document.body.appendChild(newScript);
    oldScript.remove();
  });
  window[loadedFlag] = true;
}

/* ═══════════════════════════════════════════════════════════
   COLUMN LINE CURSOR BEND
   Each vertical grid line warps toward the cursor using a
   Gaussian displacement — subtle, same feel as dot scatter.
═══════════════════════════════════════════════════════════ */
(function initColLines() {
  const svg      = document.getElementById('col-lines-svg');
  const colPaths = [...svg.querySelectorAll('path')];
  const FRACS    = [0.20, 0.40, 0.60, 0.80];
  const SEGS     = 60;       // points per line — smooth curve
  const H_RADIUS = 280;      // horizontal influence radius (px)
  const SIGMA_Y  = 220;      // vertical gaussian spread (px)
  const MAX_DISP = 14;       // max horizontal bend (px) — keep it subtle
  const TWO_SIG2 = 2 * SIGMA_Y * SIGMA_Y;

  // Smoothed mouse for the lines (light spring, slower than cursor ring)
  let clx = mx, cly = my;

  function tick() {
    const w = window.innerWidth;
    const h = window.innerHeight;

    // Gentle smooth follow
    clx += (mx - clx) * 0.08;
    cly += (my - cly) * 0.08;

    FRACS.forEach((frac, idx) => {
      const lx    = frac * w;
      const dx    = clx - lx;
      const hdist = Math.abs(dx);
      // Horizontal falloff — only lines within H_RADIUS feel the pull
      const hfactor = Math.max(0, 1 - hdist / H_RADIUS);
      const disp    = dx * MAX_DISP / H_RADIUS * hfactor * hfactor;

      let d = `M ${lx} 0`;
      for (let i = 1; i <= SEGS; i++) {
        const y    = (i / SEGS) * h;
        const dy   = cly - y;
        const gaus = Math.exp(-(dy * dy) / TWO_SIG2);
        d += ` L ${(lx + disp * gaus).toFixed(2)} ${y}`;
      }
      colPaths[idx].setAttribute('d', d);
    });

    requestAnimationFrame(tick);
  }
  tick();
})();

/* ═══════════════════════════════════════════════════════════
   WORK PANEL COLUMN LINE CURSOR BEND
═══════════════════════════════════════════════════════════ */
(function initWorkColLines() {
  const svg      = document.getElementById('work-col-lines-svg');
  if (!svg) return;
  const colPaths = [...svg.querySelectorAll('path')];
  const FRACS    = [0.20, 0.40, 0.60, 0.80];
  const SEGS     = 60;
  const H_RADIUS = 280;
  const SIGMA_Y  = 220;
  const MAX_DISP = 14;
  const TWO_SIG2 = 2 * SIGMA_Y * SIGMA_Y;

  let clx = mx, cly = my;

  function tick() {
    const panel = document.getElementById('work-panel');
    if (!panel || !panel.classList.contains('open')) {
      requestAnimationFrame(tick); return;
    }
    const w = panel.offsetWidth;
    const h = panel.offsetHeight;

    clx += (mx - clx) * 0.08;
    cly += (my - cly) * 0.08;

    FRACS.forEach((frac, idx) => {
      const lx      = frac * w;
      const dx      = clx - lx;
      const hfactor = Math.max(0, 1 - Math.abs(dx) / H_RADIUS);
      const disp    = dx * MAX_DISP / H_RADIUS * hfactor * hfactor;

      let d = `M ${lx} 0`;
      for (let i = 1; i <= SEGS; i++) {
        const y    = (i / SEGS) * h;
        const dy   = cly - y;
        const gaus = Math.exp(-(dy * dy) / TWO_SIG2);
        d += ` L ${(lx + disp * gaus).toFixed(2)} ${y}`;
      }
      colPaths[idx].setAttribute('d', d);
    });

    requestAnimationFrame(tick);
  }
  tick();
})();

/* ═══════════════════════════════════════════════════════════
   HERO DOT-GRID SCATTER — isolated WebGL module
   Ink dots on cream bg physically scatter from cursor.
   Clearly visible. Touch/mobile: disabled.
═══════════════════════════════════════════════════════════ */
(function initHeroDisplace() {
  'use strict';

  if (window.matchMedia('(pointer: coarse)').matches) return;
  if (window.innerWidth < 768) return;

  const stage  = document.getElementById('stage');
  const canvas = document.getElementById('hero-gl');
  if (!stage || !canvas) return;

  /* alpha:true — canvas only draws dots, CSS bg shows through.
     preserveDrawingBuffer keeps last frame when RAF loop stops. */
  const gl = canvas.getContext('webgl', {
    alpha: true, premultipliedAlpha: false,
    antialias: false, depth: false, stencil: false,
    preserveDrawingBuffer: true
  });
  if (!gl) return;

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

  const VS = `
    attribute vec2 a_pos;
    void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }
  `;

  /* ── Fragment shader ──────────────────────────────────────────
     For each pixel, search a 7×7 neighbourhood of dot-grid cells.
     Each dot's home position is displaced outward from the cursor
     with a smoothstep falloff + ripple wave.
     If this pixel falls within any displaced dot's radius → ink.
     Otherwise → fully transparent (CSS bg shows through).
  ────────────────────────────────────────────────────────────── */
  const FS = `
    precision mediump float;
    uniform vec2  u_res;
    uniform vec2  u_mouse;     /* physical px, Y-up */
    uniform float u_intensity; /* 0–1 eased         */
    uniform float u_time;

    const float GRID   = 20.0;  /* dot spacing (physical px)           */
    const float DOT_R  = 2.4;   /* dot radius (px)                     */
    const float RADIUS = 300.0; /* cursor influence radius (physical px)*/
    const float FORCE  = 70.0;  /* scatter distance — very visible      */

    /* ink colour — matches --ink: #0e0e0e */
    const vec3 INK = vec3(0.055, 0.055, 0.055);

    void main() {
      vec2 px   = gl_FragCoord.xy;
      vec2 base = floor(px / GRID);

      bool  hit     = false;
      float topInfl = 0.0;

      /* 9×9 search — covers FORCE up to 4×GRID = 80px, safe for FORCE=70 */
      for (int dy = -4; dy <= 4; dy++) {
        for (int dx = -4; dx <= 4; dx++) {
          /* home position of this dot */
          vec2 home = (base + vec2(float(dx), float(dy))) * GRID + GRID * 0.5;

          /* influence: distance-based falloff, eased by global intensity */
          float d   = length(home - u_mouse);
          float inf = (1.0 - smoothstep(0.0, RADIUS, d)) * u_intensity;

          /* ripple: rings emanate outward from cursor */
          float wave = sin(d * 0.018 - u_time * 4.2) * 0.18 + 0.82;

          /* displaced position: dot pushed outward */
          vec2 dir  = normalize(home - u_mouse + vec2(0.0001));
          vec2 pos  = home + dir * inf * FORCE * wave;

          /* does this pixel fall inside the displaced dot? */
          if (length(px - pos) < DOT_R + inf * 1.2) {
            hit     = true;
            topInfl = max(topInfl, inf);
          }
        }
      }

      if (!hit) { gl_FragColor = vec4(0.0); return; }

      /* at rest: 18% opacity — subtle grain feel
         near cursor: 28% — dots shimmer as they scatter */
      float opac = mix(0.18, 0.28, topInfl);
      gl_FragColor = vec4(INK, opac);
    }
  `;

  function mkShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, mkShader(gl.VERTEX_SHADER,   VS));
  gl.attachShader(prog, mkShader(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    canvas.remove(); return;
  }
  gl.useProgram(prog);

  const vb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vb);
  gl.bufferData(gl.ARRAY_BUFFER,
    new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'a_pos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  /* ── Uniforms ── */
  const uRes   = gl.getUniformLocation(prog, 'u_res');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');
  const uInten = gl.getUniformLocation(prog, 'u_intensity');
  const uTime  = gl.getUniformLocation(prog, 'u_time');

  /* ── State ── */
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  /* seed mouse far off-screen: dots show at home (no scatter) on load */
  let tx = -9999, ty = -9999;
  let smx = -9999 * dpr, smy = -9999 * dpr;
  let intensity   = 1.0;   /* start at 1 so rest-state dots are visible */
  let targetInten = 1.0;
  let isRunning   = false;
  const t0 = performance.now();

  /* ── Resize ── */
  function resize() {
    canvas.width  = Math.round(stage.offsetWidth  * dpr);
    canvas.height = Math.round(stage.offsetHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(uRes, canvas.width, canvas.height);
  }
  resize();
  new ResizeObserver(resize).observe(stage);

  /* ── Draw one frame ── */
  function draw() {
    const t = (performance.now() - t0) * 0.001;
    smx += (tx * dpr - smx) * 0.10;
    smy += (ty * dpr - smy) * 0.10;
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(uMouse, smx, smy);
    gl.uniform1f(uInten, intensity);
    gl.uniform1f(uTime,  t);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  /* ── RAF loop — self-terminates when scatter fully eased out ── */
  function tick() {
    /* ease scatter in quickly, back out slowly */
    const spd = targetInten > intensity ? 0.075 : 0.028;
    intensity += spd * (targetInten - intensity);
    draw();
    /* keep running while scattering; rest-state dots need no animation */
    if (Math.abs(intensity - targetInten) > 0.002 || targetInten > 0.01) {
      requestAnimationFrame(tick);
    } else {
      isRunning = false;
      /* preserveDrawingBuffer keeps the rest-state dots visible */
    }
  }
  function start() { if (!isRunning) { isRunning = true; requestAnimationFrame(tick); } }

  /* ── Events ── */
  stage.addEventListener('mousemove', (e) => {
    tx = e.clientX;
    ty = stage.offsetHeight - e.clientY; /* Y-flip: WebGL origin bottom-left */
    targetInten = 1.0;
    start();
  }, { passive: true });

  stage.addEventListener('mouseleave', () => {
    targetInten = 0.0;
    start(); /* run loop to ease scatter back out */
  });

  /* ── Initial render: dots at home, no scatter ── */
  draw();

})();

/* ═══════════════════════════════════════════════════════════
   WORK PANEL DOT-GRID — same shader, white dots on black bg
═══════════════════════════════════════════════════════════ */
(function initWorkDisplace() {
  'use strict';
  if (window.matchMedia('(pointer: coarse)').matches) return;

    void main() {

      for (int dy = -4; dy <= 4; dy++) {

      /* rest: very subtle grid; near cursor: dots scatter and brighten */
      float opac = mix(0.07, 0.38, topInfl);

    }
  `;

  function mkShader(type, src) {

  }
  const prog = gl.createProgram();
  gl.attachShader(prog, mkShader(gl.VERTEX_SHADER, VS));

  gl.useProgram(prog);

  const vb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vb);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'a_pos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const uRes   = gl.getUniformLocation(prog, 'u_res');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');
  const uInten = gl.getUniformLocation(prog, 'u_intensity');
  const uTime  = gl.getUniformLocation(prog, 'u_time');

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let tx = -9999, ty = -9999;
  let smx = -9999 * dpr, smy = -9999 * dpr;
  let intensity = 1.0, targetInten = 1.0;
  let isRunning = false;
  const t0 = performance.now();

  function resize() {
    canvas.width  = Math.round(panel.offsetWidth  * dpr);
    canvas.height = Math.round(panel.offsetHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(uRes, canvas.width, canvas.height);
  }
  resize();
  new ResizeObserver(resize).observe(panel);

  function draw() {
    const t = (performance.now() - t0) * 0.001;
    smx += (tx * dpr - smx) * 0.10;
    smy += (ty * dpr - smy) * 0.10;
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(uMouse, smx, smy);
    gl.uniform1f(uInten, intensity);
    gl.uniform1f(uTime,  t);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  function tick() {
    const spd = targetInten > intensity ? 0.075 : 0.028;
    intensity += spd * (targetInten - intensity);
    draw();
    if (Math.abs(intensity - targetInten) > 0.002 || targetInten > 0.01) {
      requestAnimationFrame(tick);
    } else { isRunning = false; }
  }
  function start() { if (!isRunning) { isRunning = true; requestAnimationFrame(tick); } }

  panel.addEventListener('mousemove', (e) => {
    tx = e.clientX;
    ty = panel.offsetHeight - e.clientY;
    targetInten = 1.0; start();
  }, { passive: true });

  panel.addEventListener('mouseleave', () => { targetInten = 1.0; start(); });

  /* draw initial rest-state grid as soon as panel first opens */
  draw();
  start();
})();
